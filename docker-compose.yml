services:
  # Один процесс NestJS: торговый движок, API и панель на Vue.
  bybit-bots:
    build: .
    env_file: .env
    environment:
      # Внутри контейнера порт всегда 3004; наружу — WEB_PORT из .env.
      WEB_PORT: "3004"
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3004}:3004"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data # состояние ботов: продолжение счёта после рестарта
    stop_grace_period: 30s # хватает на штатное сохранение состояния по SIGTERM
    restart: unless-stopped
    # Здоров, пока бот раз в минуту обновляет состояние (/api/health → 200).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1m
      timeout: 10s
      start_period: 5m
      retries: 3
